# CMA-ES Hebbian rules evolution — multi-URDF
# ============================================
# Evolves per-weight ABCD Hebbian rules against the WP1 scalar reward sum.
# Every generation evaluates each individual across `num_urdfs` morphologies,
# each URDF held in its own Genesis scene (WingedDroneEnv) — mirrors WP1
# training's Gen_Env construction so scenes are isolated (no cross-URDF
# Taichi state contamination).
#
# Usage:
#   PYTHONPATH=src python src/WP2/run.py --cfg src/WP2/configs/cma_es_rules_only.yaml \
#       --cfg.checkpoint_path logs/runs/<RUN>/tb/model_1999.pt \
#       --cfg.checkpoint_config_path logs/runs/<RUN>/config.yaml
#
# Slot layout with N URDFs, H individuals, F forests per (URDF, individual):
#   num_eval_envs is TOTAL across all URDFs and individuals.  F is auto-rounded
#   down so  N * H * F <= num_eval_envs  (every pair gets the same F forests
#   and the same F commanded speeds, so comparisons are fair).
#
# To reuse an existing catalog instead of auto-generating new URDFs:
#   --cfg.catalog.path logs/runs/<morph_run>/catalog/catalog.txt

exp_name: mutation_8_bix_validation_lstm_15 # generalist_256_10_urdf_0.005_0.05

checkpoint_path: ""        # SET THIS: path to frozen WP1 actor (.pt)
checkpoint_config_path: "" # SET THIS: path to WP1 run config.yaml

hebbian:
  enabled: true
  eta: 0.005
  evolve_eta: false
  decay: 0.05
  evolve_decay: false
  use_oja_coefficient: false
  initialize_rules_to_zero: true
  rules_per_neuron: false        # false = per-weight ABCD (4 × num_actions × hidden_dim genes).
                                 # true  = per-output-neuron ABCD: one A/B/C/D shared by all
                                 #         input weights of each output neuron (4 × num_actions
                                 #         genes). decay/eta, if evolved, stay per-weight.
  w_max: 5000.0
  A_range: [-1.5, 1.5]
  B_range: [-1.5, 1.5]
  C_range: [-1.5, 1.5]
  D_range: [-1.5, 1.5]
  decay_range: [0.0, 0.1]
  eta_range: [0.0, 0.01]

evolution:
  num_generations: 50
  population_size: 0   # hint only; actual pop size set in cmaes.population_size

cmaes:
  algorithm: "cmaes"           # "cmaes" (full covariance) or "sep-cmaes" (diagonal-only, scales linearly with genome dim)
  sigma0: 0.075                # initial step size (genome in [0,1], so 0.075 = 7.5% of domain)
  population_size: 64          # 0 = auto (≈ 4 + 3·ln(n_genes)); override for more diversity
  tol_sigma: 0.0               # 0 = never stop on sigma
  tol_fun: 0.0                 # 0 = never stop on fitness spread
  sigma_reinflate: 1.0         # on URDF/morphology change: multiply the CURRENT sigma by this factor
                               # (carry mean+covariance, re-explore the shifted objective).
                               # <= 1.0 (incl. 0) = off (pure carry, sigma keeps shrinking)
  fitness_aggregator: "mean"   # how per-(urdf,forest) reward sums reduce to one fitness per
                               # individual: null or "mean" = mean (legacy), "median" = median
                               # (robust to a single catastrophic forest). Fitness only —
                               # diagnostic metrics (progress, crash, COT, …) stay means.
  normalize_fitness: false     # min-max normalize fitness to [0,1] per generation before tell()
                               # (best individual → 1, worst → 0). Rank-preserving; logging stays raw.

  # --- UH-CMA-ES uncertainty handling (Hansen et al. 2009, sigma-only arm) ---
  # After tell(), re-evaluate the population on the SAME forests (no refresh) to
  # measure residual per-rollout rank-noise (stochastic actor + per-step aero
  # noise — the noise CRN can't remove). If rank-noise is found (noiseS>0), bump
  # sigma by alphasigma → counteracts the sigma-stall. The averaging arm is off
  # (F is pinned by num_eval_envs). Complements `crn` below.
  uh_enabled: false    # master switch
  uh_every: 1          # measure every K gens. Each measure ≈ 1 extra full-pop
                       # eval (env steps all slots regardless), so 1 ≈ 2× eval
                       # cost, 5 ≈ +20%. Must be >= 1.
  uh_reevals: 0.0      # solutions used for the MEASURE. 0 = whole population
                       # (robust, free given the full re-eval). >0 = Hansen subset.
  uh_alphasigma: 0.0   # per-measure sigma kick. 0 = pycma default 1+2/(N+10)
                       # (~1.002 for N=896 — weak, cumulative). Raise for a
                       # stronger kick; mind interaction with uh_every.
  uh_theta: 0.5        # Hansen rank-change tolerance; higher = more tolerant

catalog:
  path: ""                         # empty + num_urdfs>1 ⇒ auto-generate random URDFs at run start
  num_urdfs: 64                    # N: number of URDFs, each in its own Genesis scene
  num_episodes: 1                  # rollout episodes per generation
  force_multi_urdf: false          # route N=1 through the multi-URDF path (for verification)
  include_standard_mydrone: false  # false ⇒ all N URDFs are randomly sampled (no fixed baseline)
  refresh_urdfs_every: 8           # >0 ⇒ refresh the URDF pool every K inner generations
                                   # (tears down + rebuilds the eval env; multi-URDF path only).
                                   # 0 or null ⇒ disabled, URDFs stay fixed for the whole run.
  mutate: true                     # how a refresh produces the new pool:
                                   #   false ⇒ resample N brand-new RANDOM URDFs (default).
                                   #   true  ⇒ MUTATE the current catalog instead: add Gaussian
                                   #           noise (std mutation_std) to every gene of every
                                   #           URDF's normalized genome, clamp to [0,1], rebuild.
                                   #           Drift is cumulative across refreshes; the
                                   #           standard-mydrone baseline is mutated too. Needs
                                   #           genomes.txt (always present for auto-gen catalogs).
  mutation_std: 0.02               # std of per-gene Gaussian noise when mutate=true (genome in
                                   # [0,1], so 0.1 = 10% of domain). Ignored when mutate=false.

validation:
  enable: true               # held-out validation pass inside the inner loop
  n_val_envs: 4096           # reserved validation envs, split equally across validation_catalog URDFs
  validation_catalog: ""     # path to a catalog.txt; empty/"none" ⇒ standard mydrone drone
  period: 1                  # run on gen 0 then every `period` generations (after the baseline phase)
                             # Each pass regenerates fresh forests and evaluates BOTH the generation's
                             # best-fitness individual AND the zero-rules baseline on them, then plots
                             # both curves generation-by-generation (plots/validation/). CRN follows
                             # evaluation.crn (shared draws only when true, legacy otherwise).

evaluation:
  num_eval_envs: 245760 # TOTAL slots across all URDFs and all individuals
                       # with N=16, H=128 ⇒ F = 16384/(16·128) = 8 forests/pair
  num_eval_workers: 4  # >1 enables ParallelMultiSceneEvalEnv (N worker processes)
                       # N=2 typically saturates one GPU when a single scene uses ~50%
                       # watch VRAM: each worker holds D/N independent Genesis scenes
  num_gpus: 0          # 0 / null = auto-detect via torch.cuda.device_count()
                       # >1 spreads workers round-robin across G GPUs; URDFs are
                       # round-robin sharded across GPUs too, so each GPU runs
                       # num_eval_envs/G total env slots. SLURM must allocate G
                       # GPUs (sbatch --gpus=G). Clamped to min(G, num_workers).
  vmin: 10.0
  vmax: 20.0
  stochastic: true
  run_baseline: true   # if true, re-evaluates the frozen WP1 actor for comparison
  baseline_every: 1    # cadence when run_baseline=true: run at gen 0 then every N gens
  refresh_forests_per_generation: true  # regenerate forest layouts each generation
  crn: false           # common random numbers: share per-slot DR draws (forest, mass/COM,
                       # joint bias/step noise, latency, aero params, obs noise) across
                       # individuals flying the same forest → CMA ranks by rules, not DR luck.
                       # Full DR preserved (scenarios still span the distribution, refresh each
                       # gen). Per-step Taichi aero force noise stays per-slot. False = legacy.

  # ------------------------------------------------------------------
  # Per-slot noise toggles (true = drawn independently per env slot, so it
  # produces per-individual variance; false = force-disabled in this WP2 eval
  # so the source contributes no per-individual variance, regardless of the
  # WP1 checkpoint setting).  Stochastic actor sampling is the dominant
  # source and is controlled separately by `stochastic` above.
  # ------------------------------------------------------------------
  noise:
    action_latency: true              # ActuatorDynamics latency (per-episode draw per env)
    mass_shift: true                  # property_randomization.mass_shift_std
    com_shift: true                   # property_randomization.com_shift_std
    joint_target_episode_bias: true   # property_randomization.joint_target_episode_bias_std
    joint_target_step_noise: true     # property_randomization.joint_target_step_noise_std
    aero_noise: true                  # aero solver param + magnitude/direction noise

forest:
  # Forest-generation algorithm + parameters for the eval environment.
  # EVERY field below is null by default = "inherit the WP1 checkpoint config".
  # An all-null block reproduces the WP1 forest exactly. Any field you set
  # overrides ONLY that parameter; the rest still come from WP1.
  #
  # Precedence (low → high):  WP1 config  <  evaluation.x_upper/dens_min/dens_max
  # (legacy location)  <  this `forest` section. So values here win when set
  # in both places.
  mode: "growing"       # forest sampling algorithm:
                        #   null / "wp1" ⇒ inherit WP1 (its forest_mode or growing_forest flag)
                        #   "growing"    ⇒ density ramps dens_min→dens_max along x  (uses dens_min/dens_max)
                        #   "uniform"    ⇒ constant density, exactly num_trees_eval trees
                        #   "lattice"    ⇒ regular grid (fixed points + jitter) that densifies with x (uses the x_/y_spacing keys)
                        #   "latin"      ⇒ stratified grid: 1 RANDOM tree per cell, densifies with x (uses the x_/y_spacing keys)

  # --- corridor geometry (all modes) ---
  x_lower: 0            # forest start along forward axis [m]
  x_upper: 100          # forest end / corridor length [m]  (also sets forest_x_limit)
  y_lower: null         # lateral lower bound [m]
  y_upper: null         # lateral upper bound [m]
  tree_radius: null     # cylinder trunk radius [m]
  tree_height: null     # cylinder height [m]

  # --- "growing" mode: linear density ramp ---
  dens_min: 0.0         # density at x_lower [trees/m]
  dens_max: 5.0         # density at x_upper [trees/m]
  dens_min_min: 0.0     # optional: randomize the ramp-start density per forest (low bound)
  dens_min_max: 0.0     # optional: randomize the ramp-start density per forest (high bound)
  dens_min_slope: 0     # per-generation slope added to dens_min: dens_min(g) = dens_min + slope * g

  # --- "uniform" mode: fixed tree count ---
  num_trees: null       # tree count during training rollouts
  num_trees_eval: null  # tree count during eval (this is what WP2 rollouts use)

  # --- "lattice" and "latin" mode: grid spacings (densify with x) ---
  x_spacing_start: 8.333 # gap between x-lines at low x [m]
  x_spacing_end: 6.667   # gap between x-lines at high x [m]  (smaller ⇒ denser downrange)
  forest_length: null    # total x-extent covered by the lattice [m]  (default: x_upper - x_lower)
  y_spacing_max: 3.0     # tree spacing along the first (sparse) x-line [m]
  y_spacing_min: 3.0     # tree spacing along the last (dense) x-line [m]

seed: 67
device: "cuda:0"
base_dir: "logs/runs_hebbian"
