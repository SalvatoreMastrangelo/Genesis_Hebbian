# Full co-opt with crossover DISABLED (mutation-only evolution)
# Useful for very high-dimensional genomes (1600D) where crossover may be disruptive.
exp_name: hebbian_codesing_mutation_only

checkpoint_path: ""
checkpoint_config_path: ""

hebbian:
  enabled: true
  eta: 0.01
  evolve_eta: false
  decay: 0.01
  w_max: 3.0

evolution:
  population_size: 40
  num_generations: 30
  enable_crossover: false         # KEY: crossover disabled
  crossover_probability: 0.9      # ignored since enable_crossover=false
  mutation_probability: 1.0
  eta_c: 20.0
  eta_m: 20.0
  weights: [1.0, 1.0, 1.0]

evaluation:
  num_eval_episodes: 1
  num_eval_envs: 8192
  vmin: 6.0
  vmax: 30.0
  stochastic: true

objectives:
  velocity: true
  energy: true
  progress: true

morphology:
  evolve: true
  fixed_genome: null

seed: 42
device: "cuda:0"
base_dir: "logs/runs_hebbian"
