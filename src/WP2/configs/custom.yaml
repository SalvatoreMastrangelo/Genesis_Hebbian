# Custom CMA-ES Hebbian rules experiment
exp_name: rules_from_0

checkpoint_path: ""        # SET THIS: path to frozen WP1 actor checkpoint
checkpoint_config_path: "" # SET THIS: path to the WP1 run's config.yaml

hebbian:
  enabled: true
  eta: 0.0001
  evolve_eta: false
  decay: 0.001
  evolve_decay: false
  use_oja_coefficient: false
  initialize_rules_to_zero: true
  w_max: 5000.0
  A_range: [-1.0, 1.0]
  B_range: [-1.0, 1.0]
  C_range: [-1.0, 1.0]
  D_range: [-1.0, 1.0]
  decay_range: [0.0, 0.1]
  eta_range: [0.0, 0.1]

evolution:
  num_generations: 100
  population_size: 0   # hint only; actual pop size set in cmaes.population_size

cmaes:
  sigma0: 0.3
  population_size: 128
  tol_sigma: 0.0
  tol_fun: 0.0

catalog:
  path: ""
  num_episodes: 1

evaluation:
  num_eval_envs: 8192
  vmin: 6.0
  vmax: 30.0
  stochastic: true

seed: 1
device: "cuda:0"
base_dir: "logs/runs_hebbian"
