# CMA-ES Hebbian rules evolution
# ================================
# Evolves per-weight ABCD Hebbian rules against the WP1 scalar reward sum.
# Morphology is always fixed (WP1 default drone).
#
# Usage:
#   python -m WP2.run --cfg src/WP2/configs/cma_es_rules_only.yaml
#
# To evaluate across a catalog of URDFs (for robustness):
#   python -m WP2.run --cfg src/WP2/configs/cma_es_rules_only.yaml \
#       --cfg.catalog.path logs/runs/2026-03-26_01-33-07_96_morph/catalog/catalog.txt

exp_name: 0.075_sigma0_0.005_0.05

checkpoint_path: ""        # SET THIS: path to frozen WP1 actor (.pt)
checkpoint_config_path: "" # SET THIS: path to WP1 run config.yaml

hebbian:
  enabled: true
  eta: 0.005
  evolve_eta: false
  decay: 0.05
  evolve_decay: false
  use_oja_coefficient: false
  initialize_rules_to_zero: true
  w_max: 5000.0
  A_range: [-1.5, 1.5]
  B_range: [-1.5, 1.5]
  C_range: [-1.5, 1.5]
  D_range: [-1.5, 1.5]
  decay_range: [0.0, 0.1]
  eta_range: [0.0, 0.1]

evolution:
  num_generations: 50
  population_size: 0   # hint only; actual pop size set in cmaes.population_size

cmaes:
  sigma0: 0.075        # initial step size (genome in [0,1], so 0.075 = 7.5% of domain)
  population_size: 128 # 0 = auto (≈ 4 + 3·ln(n_genes)); override for more diversity
  tol_sigma: 0.0       # 0 = never stop on sigma
  tol_fun: 0.0         # 0 = never stop on fitness spread

catalog:
  path: ""             # empty = use default/fixed morphology only
  num_episodes: 1      # rollout episodes per URDF per individual

evaluation:
  num_eval_envs: 12800 # total envs per URDF; divided among population
  vmin: 10.0
  vmax: 20.0
  stochastic: true
  run_baseline: true   # if true, re-evaluates the frozen WP1 actor each gen for comparison
  x_upper: 500         # override forest corridor length [m]; null = use WP1 config value
  refresh_forests_per_generation: true  # regenerate forest layouts each generation

seed: 1
device: "cuda:0"
base_dir: "logs/runs_hebbian"
