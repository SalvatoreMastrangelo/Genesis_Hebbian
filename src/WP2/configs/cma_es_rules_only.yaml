# CMA-ES rules-only experiment
# ==============================
# Evolves Hebbian rules (ABCD) against the WP1 scalar reward sum.
# Morphology is fixed; no co-design.
#
# Usage:
#   python -m WP2.run --cfg src/WP2/configs/cma_es_rules_only.yaml
#
# To evaluate across a catalog of URDFs, set catalog.path:
#   python -m WP2.run --cfg src/WP2/configs/cma_es_rules_only.yaml \
#       --cfg.catalog.path logs/runs/2026-03-26_01-33-07_96_morph/catalog/catalog.txt

exp_name: cma_es_rules

checkpoint_path: ""        # SET THIS: path to frozen WP1 actor (.pt)
checkpoint_config_path: "" # SET THIS: path to WP1 run config.yaml

hebbian:
  enabled: true
  eta: 0.0001
  evolve_eta: false
  decay: 0.001
  evolve_decay: false
  use_oja_coefficient: false
  initialize_rules_to_zero: false
  w_max: 5000.0
  A_range: [-1.0, 1.0]
  B_range: [-1.0, 1.0]
  C_range: [-1.0, 1.0]
  D_range: [-1.0, 1.0]
  decay_range: [0.0, 0.1]
  eta_range: [0.0, 0.1]

evolution:
  strategy: "cma_es"
  num_generations: 500
  # population_size is not used by CMA-ES; set cmaes.population_size instead
  population_size: 0

cmaes:
  sigma0: 0.3          # initial step size (genome in [0,1], so 0.3 = 30% of domain)
  population_size: 100 # 0 = auto (≈ 4 + 3·ln(n_genes)); override for more diversity
  tol_sigma: 0.0       # disabled (0 = never stop on sigma)
  tol_fun: 0.0         # disabled (0 = never stop on fitness)

catalog:
  path: ""             # empty = use default/fixed morphology only
  num_episodes: 1      # rollout episodes per URDF per individual

evaluation:
  num_eval_episodes: 1   # ignored for CMA-ES (use catalog.num_episodes)
  num_eval_envs: 10000   # total envs per URDF; divided among population
  vmin: 10.0
  vmax: 20.0
  stochastic: false

objectives:            # only used by NSGA-II; ignored by CMA-ES
  velocity: true
  energy: true
  progress: true
  smoothness: false
  crash_rate: false

morphology:
  evolve: false          # MUST be false for CMA-ES strategy
  fixed_genome: null     # null = WP1 default drone

seed: 1
device: "cuda:0"
base_dir: "logs/runs_hebbian"
