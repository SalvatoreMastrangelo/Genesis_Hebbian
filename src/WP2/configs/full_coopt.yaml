# Full co-optimisation: Hebbian ON + Morphology ON (main experiment)
exp_name: hebbian_codesing_full

checkpoint_path: ""       # SET THIS: path to frozen WP1 actor checkpoint (e.g. logs/runs/.../tb/model_199.pt)
checkpoint_config_path: "" # SET THIS: path to the WP1 run's config.yaml

hebbian:
  enabled: true
  eta: 0.01
  evolve_eta: false
  decay: 0.01
  evolve_decay: false
  use_oja_coefficient: true
  w_max: 3.0
  A_range: [-1.0, 1.0]
  B_range: [-1.0, 1.0]
  C_range: [-1.0, 1.0]
  D_range: [-1.0, 1.0]
  decay_range: [0.0, 0.1]
  eta_range: [0.0, 0.1]

evolution:
  population_size: 40
  num_generations: 30
  enable_crossover: true
  crossover_probability: 0.9
  mutation_probability: 1.0
  eta_c: 20.0
  eta_m: 20.0
  mutation_operator: "polynomial"
  mutation_sigma: 0.05
  weights: [1.0, 1.0, 1.0]

evaluation:
  num_eval_episodes: 1
  num_eval_envs: 8192
  vmin: 6.0
  vmax: 30.0
  stochastic: true

objectives:
  velocity: true
  energy: true
  progress: true
  smoothness: false
  crash_rate: false

morphology:
  evolve: true
  fixed_genome: null

seed: 42
device: "cuda:0"
base_dir: "logs/runs_hebbian"
