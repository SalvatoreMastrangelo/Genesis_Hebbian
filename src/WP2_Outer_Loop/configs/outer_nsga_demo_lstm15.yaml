# WP2 Outer Loop — local demo run (LSTM-15 checkpoint, 4 URDFs, 8 GB GPU).
# ==========================================================================
# SINGLE-FILE config: a plain inner-loop (HebbianEvolutionConfig) YAML plus
# the `outer:` NSGA-II section. The run behaves exactly like an inner-loop
# multi-URDF run with periodic URDF refresh, except each refresh is an
# NSGA-II update (select elites, breed offspring) instead of random
# resampling. Demonstrates improving Pareto fronts (fitness vs cost of
# transport) with the persistent-CMA + NSGA-II outer loop.
#
#   PYTHONPATH=src python -m WP2_Outer_Loop.run \
#       --cfg src/WP2_Outer_Loop/configs/outer_nsga_demo_lstm15.yaml
#
# Outer-loop sizing lives in the standard inner fields:
#   catalog.num_urdfs           = 4    → NSGA-II population (N URDFs, one scene each)
#   catalog.refresh_urdfs_every = 8    → CMA generations per phase
#   evolution.num_generations   = 144  → 18 phases × 8 gens
#   evaluation.num_eval_envs    = 512  → 4 URDFs × 16 CMA pop × 8 forests/(URDF, ind)

exp_name: outer_nsga_demo_lstm15

# --- WP1 controller (LSTM-15, batch_11) ---
checkpoint_path: "src/WP2/experiments/batch_11/mutation_2_bix_validation_lstm_15/checkpoint.pt"
checkpoint_config_path: "src/WP2/experiments/batch_11/mutation_2_bix_validation_lstm_15/wp1_config.yaml"

# --- Outer loop: NSGA-II morphology update (fires at every URDF refresh) ---
outer:
  n_elites: 2                # survivors kept (and re-scored) per update
  score_top_frac: 0.5        # top fraction of CMA individuals used to score URDFs
  score_window: 0            # 0 = all gens of the phase; k>0 = last k gens only
  crossover_prob: 0.9        # SBX application probability
  mutation_prob: 0.0667      # per-gene polynomial mutation (≈1/15)
  sbx_eta: 15.0              # SBX distribution index
  pm_eta: 20.0               # polynomial mutation distribution index
  # Supported names: fitness, cost_of_transport, progress_m, velocity, crash_rate
  objectives:
    - name: fitness
      direction: maximize
    - name: cost_of_transport
      direction: minimize

hebbian:
  enabled: true
  eta: 0.005
  evolve_eta: false
  decay: 0.05
  evolve_decay: false
  use_oja_coefficient: false
  initialize_rules_to_zero: true
  rules_per_neuron: false        # false = per-weight ABCD (4 × num_actions × hidden_dim genes)
  w_max: 5000.0
  A_range: [-1.5, 1.5]
  B_range: [-1.5, 1.5]
  C_range: [-1.5, 1.5]
  D_range: [-1.5, 1.5]
  decay_range: [0.0, 0.1]
  eta_range: [0.0, 0.01]

evolution:
  num_generations: 144   # total CMA generations = phases × refresh_urdfs_every
  population_size: 0     # hint only; actual pop size set in cmaes.population_size

cmaes:
  algorithm: "cmaes"
  sigma0: 0.075
  population_size: 16          # H; 0 = auto (≈ 4 + 3·ln(n_genes))
  tol_sigma: 0.0
  tol_fun: 0.0
  sigma_reinflate: 1.5         # on morphology change: multiply CURRENT sigma by this
                               # factor (carry mean+covariance, re-explore); <= 1.0 = off
  fitness_aggregator: "mean"
  normalize_fitness: false
  uniform_weighting: false
  uh_enabled: false
  uh_every: 1
  uh_reevals: 0.0
  uh_alphasigma: 0.0
  uh_theta: 0.5

catalog:
  path: ""                         # empty ⇒ auto-generate the initial N random URDFs
  num_urdfs: 4                     # N: NSGA-II population size, one Genesis scene each
  num_episodes: 1
  force_multi_urdf: false
  include_standard_mydrone: false  # all-random start → visible front improvement
  refresh_urdfs_every: 8           # CMA generations per outer phase (NSGA-II cadence)
  mutate: false                    # must stay false: NSGA-II replaces blind mutation

validation:
  enable: false              # held-out validation is expensive inside the outer loop
  n_val_envs: 2048
  validation_catalog: ""
  period: 1

evaluation:
  num_eval_envs: 512   # TOTAL slots = N × H × F  (4 × 16 × 8)
  num_eval_workers: 1  # sequential scenes in-process (safe on 8 GB VRAM)
  num_gpus: 0
  vmin: 10.0
  vmax: 20.0
  stochastic: true
  run_baseline: true
  baseline_every: 8
  refresh_forests_per_generation: true
  crn: false
  noise:
    action_latency: true
    mass_shift: true
    com_shift: true
    joint_target_episode_bias: true
    joint_target_step_noise: true
    aero_noise: true

forest:
  mode: "growing"
  x_lower: 0
  x_upper: 100
  y_lower: null
  y_upper: null
  tree_radius: null
  tree_height: null
  dens_min: 0.0
  dens_max: 5.0
  dens_min_min: 0.0
  dens_min_max: 0.0
  dens_min_slope: 0
  num_trees: null
  num_trees_eval: null
  x_spacing_start: 8.333
  x_spacing_end: 6.667
  forest_length: null
  y_spacing_max: 3.0
  y_spacing_min: 3.0

seed: 0
device: "cuda:0"
base_dir: "logs/runs_outer"
