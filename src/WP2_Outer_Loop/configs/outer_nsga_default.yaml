# WP2 Outer Loop — persistent CMA-ES + NSGA-II URDF co-evolution.
# =================================================================
# SINGLE-FILE config: a plain inner-loop (HebbianEvolutionConfig) YAML plus
# the `outer:` NSGA-II section. One continuous CMA-ES over Hebbian rules
# (mean+covariance carried across morphology changes, sigma re-inflated on
# change); every `catalog.refresh_urdfs_every` CMA generations the
# `catalog.num_urdfs`-strong URDF population is evolved by NSGA-II on
# per-URDF objectives from a phase-end "exam" rollout (`outer.rescore`):
# the top `rescore_top_frac` of the last generation's CMA individuals
# re-fly the URDFs once on fresh forests, each covering E/k forests
# (64 pop, F=60, k=8 → 480). With `rescore: false` objectives fall back
# to the per-generation harvest (top `score_top_frac`, phase-averaged).
#
# Usage:
#   PYTHONPATH=src python -m WP2_Outer_Loop.run \
#       --cfg src/WP2_Outer_Loop/configs/outer_nsga_default.yaml \
#       --cfg.checkpoint_path        <WP1 actor .pt> \
#       --cfg.checkpoint_config_path <WP1 config.yaml>
#
#   ONE override namespace for inner and outer fields alike:
#       --cfg.catalog.num_urdfs 8  --cfg.outer.n_elites 3
#
# Env budget rule: evaluation.num_eval_envs ≥ catalog.num_urdfs × cmaes.population_size
# (each (URDF, individual) pair needs ≥ 1 forest; F = envs // (N·H)).

exp_name: full_run_4_64_64

checkpoint_path: ""        # SET THIS: path to frozen WP1 actor (.pt)
checkpoint_config_path: "" # SET THIS: path to WP1 run config.yaml

# --- Outer loop: NSGA-II morphology update (fires at every URDF refresh) ---
outer:
  n_elites: 2                # survivors kept (and re-scored) per update
  score_top_frac: 0.5        # top fraction of CMA individuals used to score URDFs
  score_window: 0            # 0 = all gens of the phase; k>0 = last k gens only
  rescore: true              # phase-end exam rollout sources the NSGA-II objectives
                             # (fresh forests, live env reused; phase harvest = fallback)
  rescore_top_frac: 0.125    # top fraction of last gen's CMA individuals in the exam;
                             # k rounded down to a divisor of E → each flies E/k forests
  # Exam-only forest overrides — applied right before the exam rollout and
  # restored right after (inner-loop generations are untouched). Inert unless
  # override_forest is true. tree_radius and the y corridor are NOT
  # overridable (DepthSolver bakes them at env build; changing them would
  # desync perception from collision).
  exam_forest:
    override_forest: false   # master switch: true = exam flies THESE forests
    dens_min: 2.0            # denser floor (growing mode, trees/100 m²)
    dens_max: 8.0            # denser ceiling
    forest_mode: growing     # uniform | growing | lattice | latin
    x_upper: 900.0           # longer forest; also moves the eval success line
                             # (60 s episodes still cap distance at ~vmax*60 m)
    # num_trees: 800         # uniform mode only
  min_progress_m: 0.0        # admission gate (meters): morphs below this progress
                             # (exam if it ran, else phase mean) are barred from
                             # elites/parents; 0 = gate off
  crossover_prob: 0.9        # SBX application probability
  mutation_prob: 0.0667      # per-gene polynomial mutation (≈1/15)
  sbx_eta: 15.0              # SBX distribution index
  pm_eta: 20.0               # polynomial mutation distribution index
  # Supported names: fitness, cost_of_transport, progress_m, velocity, crash_rate
  objectives:
    - name: progress_m
      direction: maximize
    - name: cost_of_transport
      direction: minimize

hebbian:
  enabled: true
  eta: 0.005
  evolve_eta: false
  decay: 0.05
  evolve_decay: false
  use_oja_coefficient: false
  initialize_rules_to_zero: true
  rules_per_neuron: false        # false = per-weight ABCD (4 × num_actions × hidden_dim genes)
  w_max: 5000.0
  A_range: [-1.5, 1.5]
  B_range: [-1.5, 1.5]
  C_range: [-1.5, 1.5]
  D_range: [-1.5, 1.5]
  decay_range: [0.0, 0.1]
  eta_range: [0.0, 0.01]

evolution:
  num_generations: 30    # total CMA generations = phases × refresh_urdfs_every
  population_size: 0     # hint only; actual pop size set in cmaes.population_size

cmaes:
  algorithm: "cmaes"
  sigma0: 0.075
  population_size: 16          # H; 0 = auto (≈ 4 + 3·ln(n_genes))
  tol_sigma: 0.0
  tol_fun: 0.0
  sigma_reinflate: 1.0         # on morphology change: multiply CURRENT sigma by this
                               # factor (carry mean+covariance, re-explore); <= 1.0 = off
  fitness_aggregator: "mean"
  normalize_fitness: false
  uniform_weighting: false
  uh_enabled: false
  uh_every: 1
  uh_reevals: 0.0
  uh_alphasigma: 0.0
  uh_theta: 0.5

catalog:
  path: ""                         # empty ⇒ auto-generate the initial N random URDFs
  num_urdfs: 4                     # N: NSGA-II population size, one Genesis scene each
  num_episodes: 1
  force_multi_urdf: false
  include_standard_mydrone: false  # true ⇒ slot 0 = standard mydrone; rest random
  refresh_urdfs_every: 4           # CMA generations per outer phase (NSGA-II cadence)
  mutate: false                    # must stay false: NSGA-II replaces blind mutation

validation:
  enable: true                     # held-out validation is expensive inside the outer loop
  n_val_envs: 2048
  validation_catalog: ""
  period: 1

evaluation:
  num_eval_envs: 256   # TOTAL slots = N × H × F  (4 × 16 × 4)
  num_eval_workers: 1  # sequential scenes in-process (safe on 8 GB VRAM)
  num_gpus: 0
  vmin: 10.0
  vmax: 20.0
  stochastic: true
  run_baseline: true
  baseline_every: 2
  refresh_forests_per_generation: true
  crn: false
  noise:
    action_latency: true
    mass_shift: true
    com_shift: true
    joint_target_episode_bias: true
    joint_target_step_noise: true
    aero_noise: true

forest:
  mode: "growing"
  x_lower: 0
  x_upper: 100
  y_lower: null
  y_upper: null
  tree_radius: null
  tree_height: null
  dens_min: 0.0
  dens_max: 5.0
  dens_min_min: 0.0
  dens_min_max: 0.0
  dens_min_slope: 0
  num_trees: null
  num_trees_eval: null
  x_spacing_start: 8.333
  x_spacing_end: 6.667
  forest_length: null
  y_spacing_max: 3.0
  y_spacing_min: 3.0

seed: 67
device: "cuda:0"
base_dir: "logs/runs_outer"
