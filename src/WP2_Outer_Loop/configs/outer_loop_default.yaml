# WP2 Outer Loop — NSGA-II URDF co-evolution + inner CMA-ES Hebbian rules.
# ==========================================================================
#
# This config pins a full outer-loop experiment:
#   * NSGA-II over URDF morphology population (15D Chromosome_Drone genome)
#   * Inner CMA-ES over Hebbian rules, nested per outer generation
#
# Usage:
#   PYTHONPATH=src python src/WP2_Outer_Loop/run.py \
#       --cfg src/WP2_Outer_Loop/configs/outer_loop_default.yaml \
#       --cfg.checkpoint_path        logs/runs/<RUN>/tb/model_1999.pt \
#       --cfg.checkpoint_config_path logs/runs/<RUN>/config.yaml \
#       --cfg.inner_cfg_template     src/WP2/configs/cma_es_rules_only.yaml \
#       --cfg.outer_generations 20 \
#       --cfg.population_size 16 \
#       --cfg.num_eval_envs 256
#
# The inner-loop template (inner_cfg_template) supplies the HebbianConfig +
# CMAESConfig used for the rule search; this file only overrides fields the
# outer loop needs to control (inner generations, total env budget, catalog).

exp_name: outer_loop

# --- Loop sizing ---
outer_generations: 20        # NSGA-II generations
inner_generations: 5         # CMA-ES generations per outer generation
population_size: 2           # NSGA-II population P (must be even)
num_eval_envs: 256           # Total env budget per evaluation pass

seed: 0

# --- Initial population ---
seed_standard_drone: true    # Slot 0 = standard-mydrone genome; rest random

# --- Paths ---
# inner_cfg_template must be a fully-formed HebbianEvolutionConfig YAML.
# Override from the CLI with: --cfg.inner_cfg_template <path>
inner_cfg_template: "src/WP2/configs/cma_es_rules_only.yaml"
base_dir: "logs/runs_outer"

# --- WP1 controller (overrides the inner template when non-empty) ---
# Either fill these in here or pass on the CLI:
#   --cfg.checkpoint_path        logs/runs/<RUN>/tb/model_1999.pt
#   --cfg.checkpoint_config_path logs/runs/<RUN>/config.yaml
checkpoint_path: ""
checkpoint_config_path: ""

# --- Inner-loop worker override (null = inherit from inner template) ---
# >1 enables ParallelMultiSceneEvalEnv inside the inner CMA-ES. Each worker
# holds D/N independent Genesis scenes — watch VRAM if you raise this.
#   --cfg.inner_num_eval_workers 2
inner_num_eval_workers: 2

# --- NSGA-II operators (DEAP) ---
nsga2:
  crossover_prob: 0.9        # SBX application probability
  mutation_prob: 0.0667      # per-gene polynomial mutation (1/15)
  sbx_eta: 15.0              # SBX distribution index (DEAP default)
  pm_eta: 20.0               # polynomial mutation distribution index (DEAP default)

# --- Objectives ---
# Each URDF's fitness is a tuple of these values in this order.
# Supported names: progress_m, cost_of_transport, fitness, velocity,
# crash_rate, velocity_deviation.
objectives:
  - name: progress_m
    direction: maximize
  - name: cost_of_transport
    direction: minimize
