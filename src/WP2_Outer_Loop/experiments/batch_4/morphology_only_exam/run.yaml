# Outer NSGA-II morphology co-evolution — MORPHOLOGY ONLY, 88 phases, EXAM
# ========================================================================
# The controller-null control for batch_3: same WP1 checkpoint / wp1_config,
# same exam-forest protocol (300 m course, dens 1.0–5.5, exam baseline, 80 m
# admission gate), but the plasticity is switched OFF (hebbian.eta = 0.0), so
# the frozen WP1 generalist flies every URDF unchanged and the ONLY thing
# evolving across the run is morphology.
#
# It is batch_1/morphology_only re-run with batch_3's phase-end exam bolted on
# (batch_1 scored URDFs from the per-generation harvest on the nominal 100 m
# forest; here the NSGA-II objectives come from a dedicated exam rollout on the
# hard 300 m course, so the two batches are directly comparable).
#
# Cadence: catalog.refresh_urdfs_every = 1 ⇒ ONE CMA generation per outer
# phase, so 88 CMA generations = 88 NSGA-II morphology updates = 88 exams.
# This is the most expensive cadence per generation (NSGA-II update + exam
# rollout + exam baseline + scene teardown/rebuild EVERY generation), which is
# why the CMA population is trimmed to the minimum below.
#
# Why H = 2: with eta = 0 the Hebbian genome is inert — every CMA individual is
# behaviourally the SAME policy, so a large H buys nothing but noise (a top-k
# exam pick over clones is pure winner's curse). H = 2 is the CMA minimum and
# it hands the whole slot budget to forest sampling instead: E = 245760 / 64 =
# 3840 forests per URDF, and rescore_top_frac → k = 1, so the exam flies the
# generalist on all 3840 fresh forests per URDF — an 8× wider forest sample
# than batch_3's exam (top 8 of 64 × 480 forests each), i.e. the lowest-noise
# per-morphology score the budget allows.
#
# Seed 67 (+ repeat offset) matches batch_3, so the initial random URDF catalog
# and the forest streams are paired with the plastic runs.
#
# Objectives per URDF: mean forward progress [m] (maximize) vs cost of
# transport (minimize), measured by the exam rollout.
#
# Local usage:
#   PYTHONPATH=src python -m WP2_Outer_Loop.run \
#       --cfg src/WP2_Outer_Loop/experiments/batch_4/morphology_only_88/run.yaml \
#       --cfg.checkpoint_path        src/WP2_Outer_Loop/experiments/batch_4/morphology_only_88/checkpoint.pt \
#       --cfg.checkpoint_config_path src/WP2_Outer_Loop/experiments/batch_4/morphology_only_88/wp1_config.yaml
#
# IZAR: bash src/WP2_Outer_Loop/slurm_jobs/run_parallel.sh \
#           src/WP2_Outer_Loop/experiments/batch_4/
# (the slurm script injects checkpoint_path / checkpoint_config_path)

exp_name: morphology_only_exam
repeat: 4

checkpoint_path: ""        # injected by the slurm script (checkpoint.pt)
checkpoint_config_path: "" # injected by the slurm script (wp1_config.yaml)

# --- Outer loop: NSGA-II morphology update (fires at every URDF refresh) ---
outer:
  n_elites: 32               # survivors kept (and re-scored) per update — half of
                             # num_urdfs, same elite ratio as batch_1 / batch_3
  score_top_frac: 0.5        # top fraction of CMA individuals used to score URDFs
                             # (diagnostics only while rescore: true)
  score_window: 0            # 0 = all gens of the phase; k>0 = last k gens only
  rescore: true              # phase-end exam rollout sources the NSGA-II objectives
  rescore_top_frac: 0.125    # with H=2 → k = max(1, round(2×0.125)) = 1 controller
                             # → 3840/1 = 3840 fresh forests per URDF
  # Exam-only forest (restored right after the exam; inner gens untouched)
  exam_forest:
    override_forest: true    # master switch: the exam flies THESE forests
    x_upper: 300.0           # 3× the inner course (100 m); success line moves too
    dens_min: 1.0            # inner loop floor: 0.0
    dens_max: 5.5            # inner loop ceiling: 5.0
  exam_baseline: true        # standard mydrone + zero-rules generalist re-flown
                             # on the SAME exam forests (reuses the validation
                             # env) → results/outer_exam_baseline.csv = the star
  min_progress_m: 80.0       # hard admission gate on EXAM progress [m]: morphs
                             # below it never become elites or parents (barely
                             # flying / low-CoT morphs stop squatting on the
                             # front). 0 = off; ungated + warning if nobody clears
  crossover_prob: 0.9        # SBX application probability
  mutation_prob: 0.0667      # per-gene polynomial mutation (≈1/15)
  sbx_eta: 15.0              # SBX distribution index
  pm_eta: 20.0               # polynomial mutation distribution index
  objectives:
    - name: progress_m
      direction: maximize
    - name: cost_of_transport
      direction: minimize

hebbian:
  enabled: true                  # kept ON with eta=0 so the forward pass /
                                 # wrapper code path is IDENTICAL to batch_3 —
                                 # only the weight update is zeroed
  eta: 0.0                       # <<< morphology only: no plasticity at all
  evolve_eta: false
  decay: 0.05
  evolve_decay: false
  use_oja_coefficient: false
  initialize_rules_to_zero: true
  rules_per_neuron: false        # false = per-weight ABCD (4 × num_actions × hidden_dim genes)
  w_max: 5000.0
  A_range: [-1.5, 1.5]
  B_range: [-1.5, 1.5]
  C_range: [-1.5, 1.5]
  D_range: [-1.5, 1.5]
  decay_range: [0.0, 0.1]
  eta_range: [0.0, 0.01]

evolution:
  num_generations: 88    # 88 CMA generations = 88 NSGA-II updates (refresh every 1)
  population_size: 0     # hint only; actual pop size set in cmaes.population_size

cmaes:
  algorithm: "cmaes"
  sigma0: 0.075
  population_size: 2           # H — CMA minimum; the genome is inert at eta=0
  tol_sigma: 0.0
  tol_fun: 0.0
  sigma_reinflate: 1.0         # off (pure carry across morphology changes) — same as
                               # the batch_8 reference; 1.5 compounds phase after
                               # phase and blows sigma up (see experiments/README.md)
  fitness_aggregator: "mean"
  normalize_fitness: false
  uh_enabled: false
  uh_every: 1
  uh_reevals: 0.0
  uh_alphasigma: 0.0
  uh_theta: 0.5

catalog:
  path: ""                         # empty ⇒ auto-generate the initial N random URDFs
  num_urdfs: 64                    # N: NSGA-II population size, one Genesis scene each
  num_episodes: 1
  force_multi_urdf: false
  include_standard_mydrone: false  # all-random start (same as batch_1 / batch_3)
  refresh_urdfs_every: 1           # CMA generations per outer phase (NSGA-II cadence)
  mutate: false                    # must stay false: NSGA-II replaces blind mutation

validation:
  enable: true               # held-out pass on the standard mydrone, as in batch_8
  n_val_envs: 4096
  validation_catalog: ""     # empty ⇒ standard mydrone drone
  period: 1                  # must stay ≤ refresh_urdfs_every (cold-start bias on
                             # the exam baseline otherwise — see _run_exam_baseline)

evaluation:
  num_eval_envs: 245760 # TOTAL slots = N × H × F  (64 × 2 × 1920 forests/pair)
                        #            ⇒ E = 3840 forests per URDF
  num_eval_workers: 4   # ParallelMultiSceneEvalEnv (N worker processes)
  num_gpus: 0           # 0 = auto-detect via torch.cuda.device_count()
  vmin: 10.0
  vmax: 20.0
  stochastic: true
  run_baseline: true
  baseline_every: 1     # matches refresh_urdfs_every (one baseline per phase)
  refresh_forests_per_generation: true
  crn: false
  noise:
    action_latency: true
    mass_shift: true
    com_shift: true
    joint_target_episode_bias: true
    joint_target_step_noise: true
    aero_noise: true

forest:
  mode: "growing"
  x_lower: 0
  x_upper: 100
  y_lower: null
  y_upper: null
  tree_radius: null
  tree_height: null
  dens_min: 0.0
  dens_max: 5.0
  dens_min_min: 0.0
  dens_min_max: 0.0
  dens_min_slope: 0
  num_trees: null
  num_trees_eval: null
  x_spacing_start: 8.333
  x_spacing_end: 6.667
  forest_length: null
  y_spacing_max: 3.0
  y_spacing_min: 3.0

seed: 67
device: "cuda:0"
base_dir: "logs/runs_outer"
