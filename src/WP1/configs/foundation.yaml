##############################################################################
# Foundation training config — multi-morphology pretraining.
#
# Uses Gen_Env with a URDF catalog.  Actor has NO genome access.
##############################################################################

exp_name: 96_morph

training:
  num_envs: 4000
  max_iterations: 20
  eval_interval: 100

env:
  dens_min: 0.0
  dens_max: 4.0
  dens_min_min: 0.0
  dens_min_max: 3.0
  growing_forest: true
  randomize_init_quat: false
  randomize_joint_pos: false

# Evaluation-specific environment overrides (for videos/evaluation episodes)
# If a field is null, the training env value is used
eval:
  episode_length_s: 300.0      # Longer eval episodes
  aero_noise: false             # No noise during eval
  forest_x_limit: 300.0         # 2x longer forest corridor
  x_upper: 300.0
  dens_min: null                # Use training value
  dens_max: null                # Use training value

obs:
  add_genome_obs_actor: false
  add_genome_obs_critic: true
  include_joint_pos_critic: true
  include_joint_vel_critic: true
  include_ang_vel_critic: true

catalog:
  n_urdf: 20
  catalog_dir: null # Not needed anymore unless specified in the CLI
  urdf_seed: 89654

lss:
  enabled: false
  urdf_shard_size: 64
  num_workers: 0
  collection_gpus: 1
