##############################################################################
# WP1 custom config — complete, single-file overlay.
#
# Every knob the wrapper can route into winged_drone_train.train is present
# here, even those left at their defaults. Edit any value in place; CLI
# `--cfg.section.key value` still deep-merges on top of this file.
#
# Run with:
#   PYTHONPATH=src python -m WP1.train --cfg src/WP1/configs/custom.yaml
##############################################################################

exp_name: shards_post_hebbian_rebuild

##############################################################################
# Training loop / runner
#   num_envs, max_iterations, device  → consumed directly by WP1.train
#   num_steps_per_env, save_interval, seed, empirical_normalization
#                                     → forwarded into train_cfg (RSL-RL)
##############################################################################
training:
  num_envs: 16384                          # parallel environments
  max_iterations: 850                      # PPO updates
  device: cuda:0                           # torch device for runner + env
  num_steps_per_env: 25                    # T in PPO (rollout horizon)
  save_interval: 50                        # checkpoint every N iterations
  seed: 1                                  # set to omit to fall back to OS-entropy seeding
  empirical_normalization: true            # RSL-RL running obs normalization

##############################################################################
# PPO  (forwarded into train_cfg["algorithm"])
##############################################################################
ppo:
  clip_param: 0.15                         # PPO ratio clipping ε
  desired_kl: 0.006                        # adaptive-LR target KL
  entropy_coef: 0.002                      # entropy bonus weight
  gamma: 0.99                              # discount factor
  lam: 0.9                                 # GAE-λ
  learning_rate: 1.0e-4                    # Adam LR (initial)
  max_grad_norm: 0.5                       # gradient L2 norm clip
  num_learning_epochs: 2                   # epochs per update
  num_mini_batches: 32                     # minibatches per epoch
  schedule: adaptive                       # "adaptive" | "fixed"
  use_clipped_value_loss: true             # PPO2-style value clipping
  value_loss_coef: 0.3                     # value loss weight
  normalize_advantage_per_mini_batch: true # per-minibatch advantage z-score

##############################################################################
# Policy network  (forwarded into train_cfg["policy"])
##############################################################################
policy:
  actor_hidden_dims: [64, 64]              # actor MLP layer sizes
  critic_hidden_dims: [64, 64]             # critic MLP layer sizes
  activation: elu                          # "elu" | "relu" | "tanh" | "selu" | ...
  init_noise_std: 0.3                      # initial Gaussian action std
  rnn_type: lstm                           # "lstm" | "gru"
  rnn_hidden_size: 64                      # recurrent hidden size (shared actor+critic)
  rnn_num_layers: 1                        # stacked recurrent layers
  max_servo: 1.0                           # tanh-scaled servo max (rad)
  max_throttle: 1.0                        # tanh-scaled throttle max

##############################################################################
# Environment  (WingedDroneEnv env_cfg)
##############################################################################
env:
  # ----- task / model -------------------------------------------------- #
  num_actions: 5                           # throttle + 4 servos (reference)
  dt: 0.01                                 # informational; env sets dt from control_hz
  drone: morphing_drone                    # "morphing_drone" | "lisparrow" | ...
  naca: "3416"                             # NACA airfoil code for wings

  # ----- termination --------------------------------------------------- #
  termination_if_close_to_ground: 0.5      # m
  termination_if_y_greater_than: 50.0      # |y| > this → terminate
  termination_if_z_greater_than: 50.0      # |z| > this → terminate

  # ----- initial pose -------------------------------------------------- #
  base_init_pos: [-30.0, 0.0, 15.0]        # x, y, z (m)
  base_init_quat: [1.0, 0.0, 0.0, 0.0]     # w, x, y, z

  # ----- episode timing ------------------------------------------------ #
  episode_length_s: 100.0                  # max episode duration (s)
  at_target_threshold: 0.1                 # m
  resampling_time_s: 3.0                   # command resample interval (s)

  # ----- action latency simulation ------------------------------------- #
  simulate_action_latency: true
  action_latency_min_steps: 0
  action_latency_max_steps: 1
  action_latency_random_per_step: false
  clip_actions: 1.0                        # hard clamp on raw actions

  # ----- visualization ------------------------------------------------- #
  visualize_target: false
  visualize_camera: true
  max_visualize_FPS: 15

  # ----- forest geometry ----------------------------------------------- #
  tree_radius: 0.75                        # cylinder radius (m)
  tree_height: 100.0                       # cylinder height (m)
  x_lower: 0.0                             # corridor lower x (m)
  x_upper: 150.0                           # corridor upper x (m); also the eval x-distance
  forest_x_limit: 150.0                    # success x-distance (m)
  y_lower: -50.0                           # corridor lower y (m)
  y_upper: 50.0                            # corridor upper y (m)

  # ----- forest density profile ---------------------------------------- #
  # `growing_forest=True` (default) uses a linear density profile:
  #   λ(x) ramps from `dens_min` at x_lower to `dens_max` at x_upper.
  # `growing_forest=False` uses uniform density with exactly `num_trees`.
  growing_forest: true
  unique_forests_eval: true                # distinct forest per env in eval
  dens_min: 0.0                            # density at x_lower (trees/m)
  dens_max: 4.0                            # density at x_upper (trees/m)
  dens_min_min: 0.0                        # per-forest dens_min randomization lower
  dens_min_max: 3.0                        # per-forest dens_min randomization upper
  num_trees: 100                           # only used when growing_forest=false
  num_trees_eval: 100                      # eval-time tree count for uniform mode

  # ----- aerodynamic noise --------------------------------------------- #
  aero_noise: true                         # enable both force noise and param noise
  aero_noise_sigma0: 0.05                  # base std on aero force mag/dir
  noise_sigma_param: 0.10                  # aero parameter randomization std

  # ----- per-env physical randomization -------------------------------- #
  property_randomization:
    mass_shift_std: 0.02                   # additive std × nominal link mass
    com_shift_std: 0.004                   # m
    joint_target_episode_bias_std: 0.01    # per-episode joint-target bias
    joint_target_step_noise_std: 0.005     # per-step joint-target noise

  warmup_runtime_kernels: false            # JIT warmup pass before training

##############################################################################
# Observations  (ObservationBuilder)
##############################################################################
obs:
  num_obs: 36                              # auto-overwritten by env after construction
  add_noise: true                          # inject Gaussian noise into actor obs
  actor_genome_obs: false                  # CRITICAL: keep false for morphology-blind actor
  critic_genome_obs: false                 # critic-side genome obs
  depth_backend: taichi                    # "taichi" (fast) | "cpu" (lower VRAM)

  privileged_obs:                          # critic-only privileged observations
    base_ang_vel: true
    joint_position: true
    joint_velocity: true
    actual_thrust: true

  genome_obs_noise:                        # noise on genome inputs (when enabled)
    episode_std: 0.1                       # resampled per episode
    step_std: 0.02                         # resampled per obs

  noise_std:                               # per-feature Gaussian noise σ
    z: 0.01                                # altitude
    quat: 0.01                             # orientation
    vel: 0.02                              # linear velocity
    depth: 0.05                            # depth readings
    last_thr: 0.0                          # last throttle action
    last_jnts: 0.0                         # last joint positions
    v_tgt: 0.0                             # commanded forward speed

##############################################################################
# Reward weights  (forwarded into reward_cfg["reward_scales"])
##############################################################################
reward:
  smooth: -0.1                             # penalty for action change between steps
  angular: -0.005                          # penalty for high angular velocity
  crash: -10.0                             # one-shot crash penalty
  obstacle: -0.1                           # exponential proximity penalty
  energy: -0.001                           # power consumption penalty
  progress: 0.5                            # gaussian-shaped forward-speed reward
  height: -0.003                           # altitude deviation penalty
  success: 0.0                             # corridor-exit bonus
  cosmetic: -1.0                           # asymmetric servo penalty
  stability: 0.0                           # oscillation penalty (unused → 0)

##############################################################################
# Command sampler
##############################################################################
command:
  num_commands: 1                          # number of simultaneous commands
  min_speed: 5.0                           # min sampled forward speed (m/s)
  max_speed: 25.0                          # max sampled forward speed (m/s)


##############################################################################
# Multi-URDF (catalog) training.
#
# Single-process backend (default, lss.enabled=false): all K Genesis scenes
# live in this process; PPO sees one merged vec-env of size training.num_envs.
# Backed by general_policy.env_gen.Gen_Env.
#
# Sharded backend (lss.enabled=true): catalog is chunked into shards of size
# lss.urdf_shard_size, each shard runs in its own subprocess (its own Genesis
# context, optionally its own GPU). The coordinator gathers rollouts every
# step and runs one global PPO update. Backed by
# general_policy.super_scene.run_logical_super_scene_training.
#
#   catalog.n_urdf=null or 0  → single-URDF mode; env_cfg.drone / --drone
#                               picks the URDF.
#   catalog.n_urdf>0          → build a fresh catalog inside
#                               logs/runs/<ts>_<exp>/catalog/.
#   catalog.catalog_dir set   → reuse an existing catalog directory.
#
# Constraint: training.num_envs >= catalog.n_urdf (each URDF gets ≥ 1 env).
##############################################################################
catalog:
  n_urdf: 8                                # null → single-URDF; integer → multi-URDF
  catalog_dir: null                        # explicit catalog path (overrides n_urdf)
  urdf_seed: 0                             # seed used by general_policy.catalog.build_catalog

##############################################################################
# Logical Super-Scene (sharded multi-URDF worker training).
#
# Requires a catalog (catalog.n_urdf > 0 or catalog.catalog_dir set).
# Genesis is NOT initialised in the main process — every worker subprocess
# initialises its own Genesis context.
##############################################################################
lss:
  enabled: true                            # true → spawn one subprocess per shard
  urdf_shard_size: 2                       # URDFs per shard; required when enabled
  num_workers: 0                           # 0 = auto: n_workers = ceil(n_urdf / urdf_shard_size).
                                           # >0 = force this many workers (rebalances URDFs).
  collection_gpus: 1                       # CUDA devices; workers are round-robined across them
                                           # (each worker = independent Genesis context → VRAM scales)
