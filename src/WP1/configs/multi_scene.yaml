# multi_scene.yaml — supplementary config for multi-scene parallel PPO training
# ==============================================================================
# Merge this file on top of a base config (default.yaml or foundation.yaml):
#
#   python -m WP1.train \
#     --cfg src/WP1/configs/foundation.yaml \
#     --multi-scene-cfg src/WP1/configs/multi_scene.yaml
#
# Effective total environments = S * N * E
# training.num_envs is IGNORED when multi_scene.enabled = true.
#
# Tuning guidance
# ---------------
# - S: number of parallel Genesis scenes (subprocesses sharing the GPU).
#   Start with S=2 and increase until you hit VRAM limits.
#   Each scene uses roughly the same VRAM as a single-scene run with N*E envs.
# - N: URDFs per scene.  N=1 → WingedDroneEnv (single morphology, fastest).
#   N>1 → MultiDroneEnv: N distinct URDF morphologies trained together in
#   one Genesis scene.  Requires --catalog-path to supply the URDF catalog.
# - E: environments per scene (shared by all N drones).  Total batch = S * N * E.
#   Physical Genesis env-slots = S * E  (N drones in each slot, same forest).
#   Match S * N * E to your target total num_envs.
# - cpu_threads_per_worker: Taichi compiler threads per subprocess.
#   2–4 is usually fine; tune for your CPU core count.

multi_scene:
  enabled: true
  S: 16                       # number of parallel scenes
  N: 1                        # URDFs per scene  →  total envs = S * N * E
  E: 800                      # environments per drone per scene
  cpu_threads_per_worker: 2   # Taichi compiler threads per worker

lss:
  enabled: false
  urdf_shard_size: 64
  num_workers: 0
  collection_gpus: 1
