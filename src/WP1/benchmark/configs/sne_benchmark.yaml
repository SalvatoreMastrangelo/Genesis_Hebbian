# SNE Grid-Search Benchmark Configuration
# =========================================
# Edit the three value lists below to define the benchmark grid.
# All combinations of (S, N, E) will be tested.

# S: number of parallel Genesis scene subprocesses
S_values: [1, 2, 4, 8, 10, 20, 32, 40, 80]

# N: number of URDF morphologies per scene
N_values: [1, 2, 4, 8, 10, 12, 16, 20, 32, 40, 64, 96, 128, 160]

# E: number of environments per scene
E_values: [32, 64, 128, 256, 384, 512, 1024, 2048, 4096]

# Number of PPO training iterations per configuration
num_iterations: 10

# Base WP1 config (env/reward/policy architecture)
base_cfg_path: "src/WP1/configs/foundation.yaml"

# URDF catalog settings (MUST be pre-built for parallel jobs to avoid race conditions)
catalog_dir: "logs/runs_benchmark/sne_grid_search/catalog"
n_urdf: 3200 # must be >= max(S_values) * max(N_values)
urdf_seed: 42

# Compute resources
device: "cuda:0"
cpu_threads_per_worker: 2

# Output
output_dir: "logs/runs_benchmark/sne_grid_search"
exp_name: "sne_grid_search"

# Timeout per (S, N, E) subprocess in seconds
subprocess_timeout_s: 6000
